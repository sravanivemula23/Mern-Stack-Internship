<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form Validation</title><link rel="stylesheet" href="style.css"></head>
<body>
<form id="signup" novalidate>
  <h1>Sign Up</h1>
  <div class="field"><label for="username">Username</label><input id="username" type="text"><small></small></div>
  <div class="field"><label for="email">Email</label><input id="email" type="email"><small></small></div>
  <div class="field"><label for="password">Password</label><input id="password" type="password"><small></small></div>
  <div class="field"><label for="confirm">Confirm Password</label><input id="confirm" type="password"><small></small></div>
  <button type="submit">Register</button>
  <p id="success"></p>
</form>
<script src="script.js"></script>
</body></html>
