<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flexbox &amp; Grid Layouts</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1>Flexbox &amp; Grid Practice</h1>
<h2>1. Flexbox – centered row with space-between</h2>
<div class="flex-row"><div class="box">1</div><div class="box">2</div><div class="box">3</div></div>
<h2>2. Flexbox – wrapping cards</h2>
<div class="flex-wrap"><div class="box">A</div><div class="box">B</div><div class="box">C</div><div class="box">D</div><div class="box">E</div><div class="box">F</div></div>
<h2>3. Grid – holy grail layout</h2>
<div class="layout"><header>Header</header><nav>Nav</nav><main>Main</main><aside>Sidebar</aside><footer>Footer</footer></div>
<h2>4. Grid – responsive gallery</h2>
<div class="gallery"><div class="box">1</div><div class="box">2</div><div class="box">3</div><div class="box">4</div><div class="box">5</div><div class="box">6</div></div>
</body></html>
